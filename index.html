<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit – Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="particles" aria-hidden="true"></canvas>
<div class="orb orb-a" aria-hidden="true"></div>
<div class="orb orb-b" aria-hidden="true"></div>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

<main class="layout">
  <!-- ============ CHARACTER STAGE ============ -->
  <section class="stage" id="stage" aria-hidden="true">
    <div class="floor"></div>
    <div class="actor" id="actor">
      <div class="shadow"></div>
      <svg viewBox="0 0 240 500" id="character" overflow="visible">
        <defs>
          <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b4670"/><stop offset="1" stop-color="#1c2240"/>
          </linearGradient>
          <linearGradient id="jacketDark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#262e52"/><stop offset="1" stop-color="#141935"/>
          </linearGradient>
          <linearGradient id="pants" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2a3050"/><stop offset="1" stop-color="#1a1f3a"/>
          </linearGradient>
          <linearGradient id="pantsDark" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#1b2040"/><stop offset="1" stop-color="#111530"/>
          </linearGradient>
        </defs>

        <g id="flip"><g id="body">
          <!-- back leg -->
          <g transform="translate(120 272)"><g id="legB">
            <rect x="-16" y="-8" width="32" height="100" rx="14" fill="url(#pantsDark)"/>
            <g transform="translate(0 90)"><g id="shinB">
              <rect x="-13" y="-4" width="26" height="94" rx="12" fill="url(#pantsDark)"/>
              <g transform="translate(0 88)"><path d="M-14 -2H12V10C12 14 30 16 36 22C38 26 36 30 30 30H-14Z" fill="#9aa3c7"/></g>
            </g></g>
          </g></g>

          <g id="upper">
            <!-- back arm -->
            <g transform="translate(120 150)"><g id="armB">
              <rect x="-11" y="-8" width="22" height="74" rx="11" fill="url(#jacketDark)"/>
              <g transform="translate(0 64)"><g id="foreB">
                <rect x="-9" y="-4" width="18" height="58" rx="9" fill="url(#jacketDark)"/>
                <circle cx="0" cy="58" r="9.5" fill="#c99a7a"/>
              </g></g>
            </g></g>

            <!-- torso -->
            <g id="torso">
              <path d="M90 136Q120 124 150 136L154 204Q156 252 148 280H92Q84 252 86 204Z" fill="url(#jacket)"/>
              <path d="M110 130Q120 150 132 130L128 124H114Z" fill="#e9ecff"/>
              <path d="M92 266H148" stroke="#5b8cff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
              <path d="M120 140V276" stroke="#0f1330" stroke-width="1.5" opacity=".5"/>
              <path d="M150 140L154 204Q156 252 148 280" fill="none" stroke="#7aa2ff" stroke-width="1.5" opacity=".45"/>
            </g>

            <!-- head -->
            <g transform="translate(120 124)"><g id="head">
              <rect x="-9" y="-14" width="18" height="24" rx="8" fill="#c99a7a"/>
              <ellipse cx="4" cy="-38" rx="25" ry="29" fill="#e7b896"/>
              <circle cx="-12" cy="-32" r="6" fill="#d9a684"/>
              <path d="M-24 -32C-34 -70 8 -84 30 -64C35 -58 33 -52 30 -49C22 -60 8 -58 -3 -55C-14 -52 -19 -44 -22 -26Z" fill="#161a28"/>
              <path d="M-4 -76C10 -84 30 -78 33 -64" fill="none" stroke="#3a4260" stroke-width="2" stroke-linecap="round"/>
              <!-- far eye / near eye -->
              <ellipse cx="27" cy="-38" rx="3.6" ry="3.8" fill="#fff"/>
              <circle class="pupil" cx="28" cy="-38" r="1.9" fill="#141824"/>
              <ellipse cx="14" cy="-37" rx="5.2" ry="4.6" fill="#fff"/>
              <circle class="pupil" cx="15" cy="-37" r="2.5" fill="#141824"/>
              <rect class="lid" x="7" y="-43" width="26" height="12" fill="#e7b896"/>
              <path id="brow" d="M8 -46Q15 -49 22 -46" fill="none" stroke="#161a28" stroke-width="2.4" stroke-linecap="round"/>
              <path d="M29 -34Q34 -28 29 -25" fill="none" stroke="#c48d6c" stroke-width="2" stroke-linecap="round"/>
              <path id="mouthN" d="M12 -15Q19 -13 25 -15" fill="none" stroke="#9a5f4d" stroke-width="2" stroke-linecap="round"/>
              <path id="mouthS" d="M10 -18Q19 -7 28 -18" fill="#fff" stroke="#9a5f4d" stroke-width="2" stroke-linejoin="round" opacity="0"/>
            </g></g>
          </g>

          <!-- front leg -->
          <g transform="translate(120 272)"><g id="legF">
            <rect x="-16" y="-8" width="32" height="100" rx="14" fill="url(#pants)"/>
            <g transform="translate(0 90)"><g id="shinF">
              <rect x="-13" y="-4" width="26" height="94" rx="12" fill="url(#pants)"/>
              <g transform="translate(0 88)"><path d="M-14 -2H12V10C12 14 30 16 36 22C38 26 36 30 30 30H-14Z" fill="#f2f4ff"/><path d="M-14 24H31" stroke="#5b8cff" stroke-width="3" stroke-linecap="round"/></g>
            </g></g>
          </g></g>

          <!-- front arm (drawn above torso) -->
          <g transform="translate(120 150)"><g id="armF">
            <rect x="-11" y="-8" width="22" height="74" rx="11" fill="url(#jacket)"/>
            <g transform="translate(0 64)"><g id="foreF">
              <rect x="-9" y="-4" width="18" height="58" rx="9" fill="url(#jacket)"/>
              <rect x="-9.5" y="40" width="19" height="7" rx="3" fill="#5b8cff" opacity=".8"/>
              <circle cx="0" cy="58" r="9.5" fill="#e7b896"/>
            </g></g>
          </g></g>
        </g></g>
      </svg>
    </div>
  </section>

  <!-- ============ LOGIN CARD ============ -->
  <section class="card-wrap">
    <div class="card" id="card">
      <div class="glare"></div>

      <div class="view" id="formView">
        <div class="logo">
          <svg width="30" height="30" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="12" stroke="url(#lg)" stroke-width="3"/><circle cx="24" cy="9" r="3.5" fill="#fff"/><defs><linearGradient id="lg" x1="4" y1="4" x2="28" y2="28"><stop stop-color="#5b8cff"/><stop offset="1" stop-color="#a478ff"/></linearGradient></defs></svg>
          <span>Orbit</span>
        </div>
        <h1>Welcome Back</h1>
        <p class="sub">Sign in to continue</p>

        <form id="form" novalidate>
          <div class="field">
            <input id="email" type="email" placeholder=" " autocomplete="email" required>
            <label for="email">Email</label>
          </div>
          <div class="field">
            <input id="password" type="password" placeholder=" " autocomplete="current-password" required>
            <label for="password">Password</label>
            <button type="button" class="eye" id="toggle" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg>
            </button>
          </div>
          <p class="err" id="err" role="alert"></p>
          <div class="row">
            <label class="check"><input type="checkbox" checked><span class="box"><svg viewBox="0 0 12 12"><path d="M2.5 6.3l2.4 2.4 4.6-5"/></svg></span>Remember me</label>
            <a href="#" class="link">Forgot password?</a>
          </div>
          <button class="btn" id="submit" type="submit">
            <span class="btn-label">Log in</span><span class="spin"></span>
          </button>
          <p class="foot">New to Orbit? <a href="#" class="link">Create account</a></p>
        </form>
      </div>

      <div class="view success" id="successView" hidden>
        <svg class="tick" viewBox="0 0 80 80" fill="none"><circle class="ring" cx="40" cy="40" r="34"/><path class="check-path" d="M25 41l10 10 20-22"/></svg>
        <h2>You're in</h2>
        <p class="sub" id="welcome">Signed in successfully.</p>
        <button class="ghost" id="again" type="button">Sign in again</button>
      </div>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="script.js"></script>
</body>
</html>
